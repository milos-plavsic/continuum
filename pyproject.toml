[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-agent"
version = "0.1.0"
description = "Governed succession control plane for enterprise agents"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.optional-dependencies]
signatures = ["cryptography>=46,<47"]
google = [
  "google-adk",
  "google-auth>=2,<3",
  "google-cloud-firestore>=2.28,<3",
  "google-cloud-pubsub>=2,<3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
