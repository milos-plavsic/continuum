[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "0.1.0"
description = "Continuum: Governance and continuity layer for autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "google-cloud-firestore>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]