name: Continuum CI

on:
  push:
    branches: [main, "agent/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 100% branch coverage + conformance + release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Run the repository's complete quality gate
        run: ./scripts/quality-gate.sh
      - name: Assert generated state and credentials are absent
        run: |
          test -z "$(git ls-files '*.tfstate' '*.tfstate.*' '*.pem' '*.key' 'service-account*.json')"
          test -z "$(git status --porcelain)"

  container:
    name: Reproducible runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the submitted Cloud Run image
        run: docker build --pull --tag continuum:${{ github.sha }} .
      - name: Verify non-root runtime and import surface
        run: |
          test "$(docker run --rm continuum:${{ github.sha }} id -u)" = "10001"
          docker run --rm --entrypoint python continuum:${{ github.sha }} -c \
            "import continuum.cloud_app; import continuum.verification; import continuum.cloud_gateway"
