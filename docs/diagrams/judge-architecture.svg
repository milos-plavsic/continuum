<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Continuum judge architecture</title><desc id="desc">An unfinished obligation crosses a governed succession boundary. The predecessor loses authority and unsafe memory; one successor resumes once; an independent verifier checks the evidence.</desc>
<rect width="1600" height="900" fill="#07111f"/><style>.h{font:700 48px system-ui;fill:#f7fbff}.s{font:24px system-ui;fill:#a9bbcf}.t{font:700 25px system-ui;fill:#f7fbff}.p{font:19px system-ui;fill:#c8d5e3}.box{fill:#10253c;stroke:#31516f;stroke-width:2}.good{fill:#0d3c34;stroke:#3ad6a0}.bad{fill:#3a1b29;stroke:#ff7797}.arrow{stroke:#6fd3ff;stroke-width:6;fill:none;marker-end:url(#a)}.n{fill:#07111f;stroke:#6fd3ff;stroke-width:3}.num{font:700 22px system-ui;fill:#6fd3ff}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#6fd3ff"/></marker></defs>
<text x="80" y="90" class="h">The agent failed. The obligation did not.</text><text x="80" y="132" class="s">One governed handoff; one external effect; independently verified.</text>
<rect x="80" y="230" rx="24" width="300" height="250" class="box"/><text x="120" y="290" class="t">Open obligation</text><text x="120" y="335" class="p">€250k supplier review</text><text x="120" y="370" class="p">deadline + evidence refs</text><text x="120" y="405" class="p">append-only state</text>
<path d="M380 355h150" class="arrow"/><circle cx="455" cy="315" r="25" class="n"/><text x="448" y="323" class="num">1</text>
<rect x="530" y="180" rx="24" width="540" height="350" class="box"/><text x="570" y="240" class="t">Continuity boundary</text><text x="570" y="290" class="p">Model Armor blocks raw injection before Gemini</text><text x="570" y="330" class="p">Deterministic gate limits eligible fleet candidates</text><text x="570" y="370" class="p">Gemini explains the evidenced recovery trade-off</text><text x="570" y="410" class="p">Policy fences old authority and filters memory</text><text x="570" y="450" class="p">Idempotency converges every redelivery</text>
<path d="M1070 355h150" class="arrow"/><circle cx="1145" cy="315" r="25" class="n"/><text x="1138" y="323" class="num">2</text>
<rect x="1220" y="230" rx="24" width="300" height="250" class="good"/><text x="1260" y="290" class="t">Successor resumes</text><text x="1260" y="335" class="p">GitHub work queue</text><text x="1260" y="370" class="p">one reversible effect</text><text x="1260" y="405" class="p">provider reconciliation</text>
<rect x="180" y="630" rx="22" width="460" height="150" class="bad"/><text x="220" y="690" class="t">Old agent: denied</text><text x="220" y="735" class="p">stale epoch · private memory excluded</text>
<rect x="960" y="630" rx="22" width="460" height="150" class="good"/><text x="1000" y="690" class="t">Independent verifier</text><text x="1000" y="735" class="p">separate identity · recomputed verdict</text>
<path d="M800 530v100h160" class="arrow"/><path d="M800 530v100H640" class="arrow"/>
<text x="80" y="850" class="s">Google ADK + Gemini 3.6 · Model Armor · Cloud Run · Firestore · Pub/Sub · Cloud Tasks · Cloud Trace</text>
</svg>
